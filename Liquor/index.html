
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>Beverage Dossier | Radisson Blu Gorakhpur</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        :root {
            --background: #222222;
            --panel: #292929;
            --gold: #c7a96b;
            --white: #ffffff;
            --muted: #bdbdbd;
            --border: rgba(255, 255, 255, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--background);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        button {
            font: inherit;
        }

        .topbar {
            min-height: 64px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            z-index: 5;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .page-counter {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        #flipbook-container {
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #flipbook {
            margin: auto;
        }

        #flipbook .page {
            background: #ffffff;
            overflow: hidden;
        }

        #flipbook .page img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            user-select: none;
            -webkit-user-drag: none;
        }

        #flipbook .hard {
            background: #ffffff;
        }

        .bottom-area {
            padding: 10px 12px 14px;
            background: var(--panel);
            border-top: 1px solid var(--border);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .control-btn {
            min-width: 42px;
            height: 40px;
            padding: 0 12px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            color: var(--white);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .control-btn:hover:not(:disabled) {
            border-color: var(--gold);
            background: rgba(199, 169, 107, 0.12);
        }

        .control-btn:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .control-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .control-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .control-label {
            font-size: 12px;
        }

        .footer {
            padding-top: 10px;
            text-align: center;
            color: #999999;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .error-message {
            max-width: 560px;
            padding: 20px;
            color: white;
            text-align: center;
            line-height: 1.6;
        }

        .error-message strong {
            color: var(--gold);
        }

        body.fullscreen .topbar,
        body.fullscreen .bottom-area {
            display: none;
        }

        body.fullscreen #flipbook-container {
            padding: 8px;
        }

        @media (max-width: 600px) {
            .topbar {
                min-height: 54px;
                padding: 10px 13px;
            }

            .brand-title {
                font-size: 11px;
                letter-spacing: 0.8px;
            }

            .brand-subtitle {
                font-size: 9px;
                letter-spacing: 1.3px;
            }

            .page-counter {
                font-size: 11px;
            }

            #flipbook-container {
                padding: 8px 5px;
            }

            .bottom-area {
                padding: 8px 6px 10px;
            }

            .controls {
                gap: 6px;
            }

            .control-btn {
                min-width: 38px;
                height: 37px;
                padding: 0 9px;
            }

            .control-label {
                display: none;
            }

            .footer {
                font-size: 8px;
            }
        }

        @media (max-height: 480px) {
            .topbar {
                min-height: 45px;
                padding: 6px 14px;
            }

            #flipbook-container {
                padding: 5px;
            }

            .bottom-area {
                padding: 5px 8px;
            }

            .control-btn {
                height: 33px;
            }

            .footer {
                padding-top: 5px;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div>
            <div class="brand-title">Radisson Blu Gorakhpur</div>
            <div class="brand-subtitle">Beverage Dossier</div>
        </div>

        <div class="page-counter" id="pageCounter" aria-live="polite">
            Page 1 of 26
        </div>
    </header>

    <main id="flipbook-container">
        <div id="flipbook" aria-label="Beverage Dossier">
            <!-- Pages are added by JavaScript -->
        </div>
    </main>

    <section class="bottom-area">
        <nav class="controls" aria-label="Beverage Dossier controls">
            <button class="control-btn" id="firstBtn" title="First page" aria-label="First page">
                <svg viewBox="0 0 24 24">
                    <path d="M18 6 10 12l8 6V6Z"></path>
                    <path d="M5 5v14"></path>
                </svg>
            </button>

            <button class="control-btn" id="prevBtn" title="Previous page" aria-label="Previous page">
                <svg viewBox="0 0 24 24">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
                <span class="control-label">Previous</span>
            </button>

            <button class="control-btn" id="nextBtn" title="Next page" aria-label="Next page">
                <span class="control-label">Next</span>
                <svg viewBox="0 0 24 24">
                    <path d="m9 18 6-6-6-6"></path>
                </svg>
            </button>

            <button class="control-btn" id="lastBtn" title="Last page" aria-label="Last page">
                <svg viewBox="0 0 24 24">
                    <path d="m6 6 8 6-8 6V6Z"></path>
                    <path d="M19 5v14"></path>
                </svg>
            </button>

            <button class="control-btn" id="soundBtn" title="Toggle page sound" aria-label="Toggle page sound">
                <svg viewBox="0 0 24 24">
                    <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                    <path d="M15 9a5 5 0 0 1 0 6"></path>
                    <path d="M18 6a9 9 0 0 1 0 12"></path>
                </svg>
            </button>

            <button class="control-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
                    <path d="M21 16v3a2 2 0 0 1-2 2h-3"></path>
                    <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span class="control-label">Fullscreen</span>
            </button>
        </nav>

        <div class="footer">Radisson Blu Gorakhpur · Beverage Dossier</div>
    </section>

    <audio id="pageSound" preload="auto">
        <source src="./paper-slide.wav" type="audio/wav">
    </audio>

    <script>
        $(function () {
            const flipbook = $("#flipbook");
            const container = $("#flipbook-container");
            const sound = document.getElementById("pageSound");

            const TOTAL_PAGES = 26;

            // Original dimensions from your supplied code.
            const DESKTOP_WIDTH = 840;
            const DESKTOP_HEIGHT = 420;
            const MOBILE_WIDTH = 420;
            const MOBILE_HEIGHT = 420;

            let currentPage = 1;
            let soundEnabled = true;
            let initialized = false;
            let resizeTimer;

            // Generate all 26 pages.
            for (let i = 1; i <= TOTAL_PAGES; i++) {
                const isHardCover = (i === 1 || i === TOTAL_PAGES);
                const page = $("<div>").addClass("page");

                if (isHardCover) {
                    page.addClass("hard");
                }

                const image = $("<img>", {
                    src: "./Page " + i + ".jpg",
                    alt: "Beverage Dossier Page " + i,
                    draggable: false
                });

                page.append(image);
                flipbook.append(page);
            }

            function isMobile() {
                return window.matchMedia("(max-width: 600px)").matches;
            }

            function calculateSize() {
                const containerWidth = container.width();
                const containerHeight = container.height();
                const mobile = isMobile();

                const baseWidth = mobile ? MOBILE_WIDTH : DESKTOP_WIDTH;
                const baseHeight = mobile ? MOBILE_HEIGHT : DESKTOP_HEIGHT;

                const scale = Math.min(
                    containerWidth / baseWidth,
                    containerHeight / baseHeight
                );

                return {
                    width: Math.max(160, Math.floor(baseWidth * scale)),
                    height: Math.max(180, Math.floor(baseHeight * scale)),
                    display: mobile ? "single" : "double"
                };
            }

            function updateControls() {
                $("#pageCounter").text(
                    "Page " + currentPage + " of " + TOTAL_PAGES
                );

                $("#firstBtn, #prevBtn").prop("disabled", currentPage <= 1);
                $("#nextBtn, #lastBtn").prop("disabled", currentPage >= TOTAL_PAGES);
            }

            function playSound() {
                if (!soundEnabled) return;

                try {
                    sound.currentTime = 0;

                    const promise = sound.play();

                    if (promise && promise.catch) {
                        promise.catch(function () {
                            // Browser audio restrictions should not block flipping.
                        });
                    }
                } catch (error) {
                    // Keep page navigation working if audio is unavailable.
                }
            }

            function goToPage(page) {
                if (!initialized) return;

                const target = Math.max(1, Math.min(TOTAL_PAGES, page));

                if (target !== currentPage) {
                    flipbook.turn("page", target);
                }
            }

            function resizeFlipbook() {
                if (!initialized) return;

                const size = calculateSize();

                flipbook.turn("size", size.width, size.height);
                flipbook.turn("display", size.display);
                flipbook.turn("page", currentPage);
            }

            // Check all page images before initializing the book.
            const imageElements = Array.from(
                document.querySelectorAll("#flipbook img")
            );

            Promise.all(imageElements.map(function (img) {
                return new Promise(function (resolve) {
                    if (img.complete && img.naturalWidth > 0) {
                        resolve(true);
                        return;
                    }

                    img.onload = function () { resolve(true); };
                    img.onerror = function () { resolve(false); };
                });
            })).then(function (results) {
                if (results.some(function (loaded) { return !loaded; })) {
                    container.innerHTML =
                        '<div class="error-message">' +
                        '<strong>Some Beverage Dossier pages could not be loaded.</strong><br>' +
                        'Check that Page 1.jpg through Page 26.jpg are in the same folder as this HTML file.' +
                        '</div>';
                    return;
                }

                if (!$.fn.turn) {
                    container.innerHTML =
                        '<div class="error-message">' +
                        '<strong>Turn.js could not be loaded.</strong><br>' +
                        'Check your internet connection and reload the page.' +
                        '</div>';
                    return;
                }

                const size = calculateSize();

                flipbook.turn({
                    width: size.width,
                    height: size.height,
                    display: size.display,
                    acceleration: true,
                    gradients: true,
                    elevation: 50,
                    autoCenter: true,
                    duration: 850,
                    when: {
                        turning: function (event, page) {
                            if (page !== currentPage) {
                                playSound();
                            }
                        },
                        turned: function (event, page) {
                            currentPage = page;
                            updateControls();
                        }
                    }
                });

                initialized = true;
                currentPage = 1;
                updateControls();
            });

            $("#firstBtn").on("click", function () {
                goToPage(1);
            });

            $("#prevBtn").on("click", function () {
                goToPage(currentPage - 1);
            });

            $("#nextBtn").on("click", function () {
                goToPage(currentPage + 1);
            });

            $("#lastBtn").on("click", function () {
                goToPage(TOTAL_PAGES);
            });

            $("#soundBtn").on("click", function () {
                soundEnabled = !soundEnabled;

                $(this)
                    .css("border-color", soundEnabled ? "" : "var(--gold)")
                    .attr(
                        "aria-label",
                        soundEnabled ? "Turn page sound off" : "Turn page sound on"
                    )
                    .attr(
                        "title",
                        soundEnabled ? "Page sound on" : "Page sound off"
                    );
            });

            $("#fullscreenBtn").on("click", async function () {
                try {
                    if (!document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();
                    } else {
                        await document.exitFullscreen();
                    }
                } catch (error) {
                    console.warn("Fullscreen is unavailable.", error);
                }
            });

            document.addEventListener("fullscreenchange", function () {
                const active = Boolean(document.fullscreenElement);

                $("body").toggleClass("fullscreen", active);

                $("#fullscreenBtn")
                    .attr("aria-label", active ? "Exit fullscreen" : "Fullscreen")
                    .attr("title", active ? "Exit fullscreen" : "Fullscreen");

                setTimeout(resizeFlipbook, 150);
            });

            $(window).on("resize", function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resizeFlipbook, 180);
            });

            $(document).on("keydown", function (event) {
                if (event.key === "ArrowRight") {
                    goToPage(currentPage + 1);
                } else if (event.key === "ArrowLeft") {
                    goToPage(currentPage - 1);
                } else if (event.key === "Home") {
                    goToPage(1);
                } else if (event.key === "End") {
                    goToPage(TOTAL_PAGES);
                }
            });
        });
    </script>
</body>
</html>
