<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings & Events | Radisson Blu Gorakhpur</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #2b2b2b 0%, #121212 100%);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #e0e0e0;
        }
        header {
            width: 100%;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            z-index: 200;
        }
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2.5px;
            color: #c5a059;
            text-transform: uppercase;
            font-weight: 600;
        }
        .brand-sub {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #aaa;
            text-transform: uppercase;
        }
        #book-container {
            width: 90vw;
            height: 76vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        .slide.active {
            display: flex;
            opacity: 1;
        }
        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border-radius: 2px;
        }
        .controls-dock {
            margin-bottom: 18px;
            padding: 8px 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(25, 25, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            z-index: 200;
        }
        .btn {
            background: transparent;
            color: #e0e0e0;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(197, 160, 89, 0.2);
            color: #c5a059;
        }
        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.15);
        }
        #pageCounter {
            font-size: 12px;
            font-weight: 600;
            color: #c5a059;
            min-width: 55px;
            text-align: center;
            letter-spacing: 1px;
        }
        /* Welcome Overlay to unlock audio and start experience */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 15, 15, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #welcome-overlay h1 {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        #welcome-overlay p {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .enter-btn {
            margin-top: 25px;
            background: #c5a059;
            color: #121212;
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1.5px;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
        }
    </style>
</head>
<body>

<!-- Welcome Screen to Unlock Audio -->
<div id="welcome-overlay">
    <h1>RADISSON BLU GORAKHPUR</h1>
    <p>Meetings & Events Digital Dossier</p>
    <button class="enter-btn">Open Brochure</button>
</div>

<header>
    <div class="brand-title">RADISSON BLU GORAKHPUR</div>
    <div class="brand-sub">Meetings & Events</div>
</header>

<div id="book-container">
    <!-- Slides injected dynamically -->
</div>

<div class="controls-dock">
    <button class="btn" id="prevBtn">&#8592; Prev</button>
    <span id="pageCounter">1 / 14</span>
    <button class="btn" id="nextBtn">Next &#8594;</button>
    <div class="divider"></div>
    <button class="btn" id="soundBtn">🔊 Sound: On</button>
    <button class="btn" id="fsBtn">&#x26F6; Fullscreen</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const totalPages = 14;
        let currentIndex = 0;
        let soundEnabled = true;
        let audioCtx = null;
        
        const container = document.getElementById('book-container');
        const pageCounter = document.getElementById('pageCounter');
        const overlay = document.getElementById('welcome-overlay');

        // Build slides
        for (let i = 1; i <= totalPages; i++) {
            const slide = document.createElement('div');
            slide.className = 'slide' + (i === 1 ? ' active' : '');
            slide.innerHTML = '<img src="Page%20' + i + '.jpg" alt="Page ' + i + '">';
            container.appendChild(slide);
        }

        const slides = document.querySelectorAll('.slide');

        function playFlipSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const duration = 0.18;
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let j = 0; j < buffer.length; j++) {
                    data[j] = (Math.random() * 2 - 1) * Math.sin((j/buffer.length) * Math.PI) * 0.25;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                noise.connect(filter);
                filter.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        function showSlide(index) {
            slides.forEach((slide, idx) => {
                slide.classList.toggle('active', idx === index);
            });
            pageCounter.textContent = (index + 1) + ' / ' + totalPages;
            playFlipSound();
        }

        // Dismiss welcome screen on click
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            playFlipSound(); // Initialize audio context
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % totalPages;
            showSlide(currentIndex);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + totalPages) % totalPages;
            showSlide(currentIndex);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % totalPages;
                showSlide(currentIndex);
            } else if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + totalPages) % totalPages;
                showSlide(currentIndex);
            }
        });

        // Sound Toggle
        const soundBtn = document.getElementById('soundBtn');
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
        });

        // Fullscreen toggle
        document.getElementById('fsBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });
    });
</script>

</body>
</html>
