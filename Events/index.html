<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meetings & Events | Radisson Blu Gorakhpur</title>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>
        body {
            background-color: #222;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #flipbook-container {
            width: 95vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-bg {
            background-color: #fff;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="flipbook-container">
    <div id="flipbook">
    </div>
</div>

<script>
    $(window).ready(function() {
        var flipbook = $('#flipbook');
        var totalPages = 14;

        // Injects background images perfectly formatted for CSS
        for (var i = 1; i <= totalPages; i++) {
            var isHardCover = (i === 1 || i === totalPages) ? ' hard' : '';
            // Added %20 to properly encode the space in "Page 1.jpg"
            var pageHTML = '<div class="page-bg' + isHardCover + '" style="background-image: url(\'Page%20' + i + '.jpg\');"></div>';
            flipbook.append(pageHTML);
        }

        var containerWidth = $('#flipbook-container').width();
        var containerHeight = $('#flipbook-container').height();
        var bookWidth = 800; 
        var bookHeight = 400;
        var displayMode = 'double';
        
        if (containerWidth < 600) {
            displayMode = 'single';
            bookWidth = 400; 
        }

        var scale = Math.min(containerWidth / bookWidth, containerHeight / bookHeight);

        // Initialize the flipbook
        flipbook.turn({
            width: bookWidth * scale,
            height: bookHeight * scale,
            display: displayMode,
            acceleration: true,
            gradients: true,
            elevation: 50,
            autoCenter: true
        });

        // Ensure it scales when the screen resizes or phone rotates
        $(window).on('resize', function() {
            var cW = $('#flipbook-container').width();
            var cH = $('#flipbook-container').height();
            var bW = 800; 
            var bH = 400;
            var dMode = 'double';
            
            if (cW < 600) {
                dMode = 'single';
                bW = 400; 
            } else {
                dMode = 'double';
            }

            var s = Math.min(cW / bW, cH / bH);
            flipbook.turn('display', dMode);
            flipbook.turn('size', bW * s, bH * s);
        });
    });
</script>

</body>
</html>
