
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Meetings &amp; Events | Radisson Blu Gorakhpur</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    :root {
      --gold: #c5a059;
      --gold-light: #e2c58b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
      color: #eee;
      font-family: Montserrat, Arial, sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
    }

    button { font: inherit; }

    .app {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #292929 0%, #151515 70%, #0b0b0b 100%);
    }

    .topbar {
      min-height: 48px;
      padding: 10px clamp(12px, 3vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #0c0c0cdd;
      border-bottom: 1px solid #c5a05955;
      z-index: 2;
    }

    .brand {
      font-family: Cinzel, serif;
      font-weight: 600;
      font-size: clamp(10px, 1.2vw, 15px);
      letter-spacing: 1.8px;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #bbb;
      text-align: right;
    }

    .stage {
      min-height: 0;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      overflow: hidden;
    }

    #book {
      position: relative;
      margin: 0 auto;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 16px 55px #0009;
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .loading {
      position: absolute;
      color: var(--gold-light);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 1;
      pointer-events: none;
    }

    .error {
      display: none;
      position: fixed;
      z-index: 10;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 600px);
      padding: 12px 16px;
      border: 1px solid #8c6a35;
      border-radius: 8px;
      background: #211c14;
      color: #f3d9a6;
      font-size: 12px;
      line-height: 1.5;
    }

    .toolbar-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 10px max(8px, env(safe-area-inset-bottom));
      background: #0c0c0cdd;
      border-top: 1px solid #c5a05944;
      z-index: 2;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 100%;
    }

    .btn {
      padding: 9px 13px;
      border: 1px solid #ffffff20;
      border-radius: 24px;
      background: #242424;
      color: #eee;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, border-color .2s;
    }

    .btn:hover:not(:disabled),
    .btn.active {
      background: #c5a05924;
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .counter {
      min-width: 62px;
      text-align: center;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .separator {
      height: 22px;
      width: 1px;
      background: #ffffff30;
      margin: 0 2px;
    }

    @media (max-width: 600px) {
      .topbar {
        min-height: 42px;
        padding: 8px 10px;
      }

      .brand {
        font-size: 10px;
        letter-spacing: 1px;
      }

      .subtitle {
        font-size: 8px;
        letter-spacing: .8px;
      }

      .stage { padding: 5px 3px; }

      .toolbar-wrap {
        padding: 7px 5px max(7px, env(safe-area-inset-bottom));
      }

      .toolbar { gap: 4px; }

      .btn {
        padding: 8px 8px;
        font-size: 10px;
      }

      .counter {
        min-width: 48px;
        font-size: 10px;
      }

      .separator { display: none; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .topbar {
        min-height: 34px;
        padding: 5px 12px;
      }

      .stage { padding: 3px 8px; }

      .toolbar-wrap { padding: 4px; }

      .btn { padding: 6px 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="app" id="app">

    <header class="topbar">
      <div class="brand">Radisson Blu Gorakhpur</div>
      <div class="subtitle">Meetings &amp; Events</div>
    </header>

    <main class="stage" id="stage" aria-label="Digital brochure">
      <div id="book"></div>
      <div class="loading" id="loading">Loading brochure…</div>
    </main>

    <div class="toolbar-wrap">
      <nav class="toolbar" aria-label="Brochure navigation">
        <button class="btn" id="firstBtn" aria-label="First page" title="First page">|←</button>
        <button class="btn" id="prevBtn" aria-label="Previous page">← Prev</button>
        <span class="counter" id="pageCounter">1 / 14</span>
        <button class="btn" id="nextBtn" aria-label="Next page">Next →</button>
        <button class="btn" id="lastBtn" aria-label="Last page" title="Last page">→|</button>
        <span class="separator"></span>
        <button class="btn active" id="soundBtn" aria-pressed="true">♪ Sound On</button>
        <button class="btn" id="fsBtn">⛶ Fullscreen</button>
      </nav>
    </div>

  </div>

  <div class="error" id="errorBox" role="alert"></div>

  <script>
    (() => {
      'use strict';

      const TOTAL_PAGES = 14;

      const app = document.getElementById('app');
      const stage = document.getElementById('stage');
      const bookEl = document.getElementById('book');
      const loadingEl = document.getElementById('loading');
      const errorBox = document.getElementById('errorBox');
      const counterEl = document.getElementById('pageCounter');
      const soundBtn = document.getElementById('soundBtn');
      const fsBtn = document.getElementById('fsBtn');

      let pageFlip = null;
      let soundEnabled = true;
      let lastSoundTime = 0;
      let resizeTimer = null;

      const pageUrl = number => `Page ${number}.jpg`;

      const pageTurnSound = new Audio('./paper-slide.wav');
      pageTurnSound.preload = 'auto';
      pageTurnSound.volume = 0.55;

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function createPages() {
        for (let number = 1; number <= TOTAL_PAGES; number++) {
          const page = document.createElement('div');
          page.className = 'page';

          const image = document.createElement('img');
          image.src = pageUrl(number);
          image.alt = `Meetings and Events brochure, page ${number}`;
          image.draggable = false;
          image.decoding = 'async';

          image.onerror = () => {
            showError(
              `Unable to load "${pageUrl(number)}". Please keep all 14 page images in the same folder as this HTML file. Check that each filename matches exactly.`
            );
          };

          page.appendChild(image);
          bookEl.appendChild(page);
        }
      }

      function getPageDimensions() {
        const stageStyle = getComputedStyle(stage);
        const availableWidth =
          stage.clientWidth -
          parseFloat(stageStyle.paddingLeft) -
          parseFloat(stageStyle.paddingRight);

        const availableHeight =
          stage.clientHeight -
          parseFloat(stageStyle.paddingTop) -
          parseFloat(stageStyle.paddingBottom);

        /*
          The brochure pages use a portrait-friendly 560:760 ratio.
          On wide screens, reserve space for a two-page spread.
          On narrow screens, use a single-page layout.
        */
        const portrait = window.innerWidth < 700;
        const pageRatio = 560 / 760;

        let pageWidth;
        let pageHeight;

        if (portrait) {
          pageWidth = Math.min(availableWidth, availableHeight * pageRatio);
          pageHeight = pageWidth / pageRatio;
        } else {
          pageWidth = Math.min(
            availableWidth / 2,
            availableHeight * pageRatio
          );
          pageHeight = pageWidth / pageRatio;
        }

        pageWidth = Math.max(160, Math.floor(pageWidth));
        pageHeight = Math.max(220, Math.floor(pageHeight));

        return {
          width: pageWidth,
          height: pageHeight
        };
      }

      function playPaperSlide() {
        if (!soundEnabled) return;

        const now = performance.now();
        if (now - lastSoundTime < 250) return;

        lastSoundTime = now;

        try {
          pageTurnSound.pause();
          pageTurnSound.currentTime = 0;

          const promise = pageTurnSound.play();

          if (promise && promise.catch) {
            promise.catch(() => {
              // Audio may be blocked until the user interacts with the page.
            });
          }
        } catch (_) {
          // Audio failure must not stop page turning.
        }
      }

      function updateSoundButton() {
        soundBtn.textContent = soundEnabled ? '♪ Sound On' : '♫ Sound Off';
        soundBtn.classList.toggle('active', soundEnabled);
        soundBtn.setAttribute('aria-pressed', String(soundEnabled));
      }

      function updateNavigation(index) {
        const pageIndex = Math.max(
          0,
          Math.min(TOTAL_PAGES - 1, Number(index) || 0)
        );

        counterEl.textContent = `${pageIndex + 1} / ${TOTAL_PAGES}`;

        document.getElementById('firstBtn').disabled = pageIndex === 0;
        document.getElementById('prevBtn').disabled = pageIndex === 0;
        document.getElementById('lastBtn').disabled =
          pageIndex === TOTAL_PAGES - 1;
        document.getElementById('nextBtn').disabled =
          pageIndex === TOTAL_PAGES - 1;
      }

      function initializeFlipbook() {
        if (!window.St || !window.St.PageFlip) {
          loadingEl.textContent = 'Unable to load brochure';
          showError(
            'The page-turning library could not load. Check your internet connection and reload the page.'
          );
          return;
        }

        const dimensions = getPageDimensions();

        pageFlip = new St.PageFlip(bookEl, {
          width: dimensions.width,
          height: dimensions.height,
          size: 'fixed',
          minWidth: 160,
          maxWidth: 1800,
          minHeight: 220,
          maxHeight: 2400,
          showCover: true,
          usePortrait: window.innerWidth < 700,
          startPage: 0,
          flippingTime: 850,
          maxShadowOpacity: 0.38,
          drawShadow: true,
          mobileScrollSupport: false,
          useMouseEvents: true,
          clickEventForward: true,
          swipeDistance: 25,
          showPageCorners: true,
          disableFlipByClick: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        pageFlip.on('init', () => {
          loadingEl.style.display = 'none';

          // Always start on the first cover page.
          pageFlip.flip(0);
          updateNavigation(0);
        });

        pageFlip.on('flip', event => {
          updateNavigation(event.data);
        });

        pageFlip.on('changeState', event => {
          if (event && event.data === 'flipping') {
            playPaperSlide();
          }
        });

        // Ensure the initial counter shows page one.
        updateNavigation(0);
      }

      function resizeBook() {
        if (!pageFlip) return;

        const dimensions = getPageDimensions();
        const portrait = window.innerWidth < 700;

        try {
          pageFlip.update({
            width: dimensions.width,
            height: dimensions.height,
            usePortrait: portrait
          });
        } catch (_) {
          /*
            If this PageFlip version does not support updating dimensions,
            recreate the book while preserving the current page.
          */
          const currentPage = pageFlip.getCurrentPageIndex();

          pageFlip.destroy();
          pageFlip = null;
          bookEl.innerHTML = '';

          createPages();
          initializeFlipbook();

          setTimeout(() => {
            if (pageFlip) pageFlip.flip(currentPage);
          }, 150);
        }
      }

      document.getElementById('firstBtn').addEventListener('click', () => {
        if (pageFlip) pageFlip.flip(0);
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (pageFlip) pageFlip.flipPrev();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (pageFlip) pageFlip.flipNext();
      });

      document.getElementById('lastBtn').addEventListener('click', () => {
        if (pageFlip) pageFlip.flip(TOTAL_PAGES - 1);
      });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;

        if (!soundEnabled) {
          pageTurnSound.pause();
          pageTurnSound.currentTime = 0;
        }

        updateSoundButton();
      });

      fsBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await app.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (_) {
          showError('Fullscreen is not supported in this browser.');
        }
      });

      document.addEventListener('fullscreenchange', () => {
        fsBtn.textContent = document.fullscreenElement
          ? '⛶ Exit Fullscreen'
          : '⛶ Fullscreen';

        setTimeout(resizeBook, 100);
      });

      document.addEventListener('keydown', event => {
        if (!pageFlip || event.ctrlKey || event.altKey || event.metaKey) return;

        if (event.key === 'ArrowRight' || event.key === 'PageDown') {
          event.preventDefault();
          pageFlip.flipNext();
        }

        if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
          event.preventDefault();
          pageFlip.flipPrev();
        }

        if (event.key === 'Home') {
          event.preventDefault();
          pageFlip.flip(0);
        }

        if (event.key === 'End') {
          event.preventDefault();
          pageFlip.flip(TOTAL_PAGES - 1);
        }
      });

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resizeBook, 150);
      });

      createPages();
      initializeFlipbook();
      updateSoundButton();
    })();
  </script>
</body>
</html>
