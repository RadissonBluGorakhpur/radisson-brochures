
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="Meetings & Events at Radisson Blu Gorakhpur">

  <title>Meetings & Events | Radisson Blu Gorakhpur</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    :root {
      --gold: #c5a059;
      --gold-light: #ead8ac;
      --bg: #111110;
      --muted: #aaa59b;
      --glass: rgba(25, 24, 22, .84);
      --glass-border: rgba(245, 223, 177, .24);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: #f7f4ed;
      font-family: "Montserrat", sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #29251f 0%, #171614 52%, #0d0d0d 100%);
    }

    .app:fullscreen {
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .topbar {
      position: relative;
      z-index: 5;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 22px;
      border-bottom: 1px solid rgba(197, 160, 89, .3);
      background: rgba(10, 10, 10, .82);
    }

    .brand { min-width: 0; }

    .brand-name {
      color: var(--gold-light);
      font-family: "Cinzel", serif;
      font-size: clamp(12px, 1.7vw, 21px);
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: clamp(7px, .8vw, 10px);
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .top-btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(197, 160, 89, .32);
      border-radius: 6px;
      color: #f7f4ed;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      transition: background .2s, border-color .2s;
    }

    .top-btn:hover,
    .top-btn.active {
      color: var(--gold-light);
      border-color: var(--gold);
      background: rgba(197, 160, 89, .13);
    }

    .main {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 8px 12px 0;
      overflow: hidden;
    }

    .heading {
      position: relative;
      z-index: 1;
      padding: 0 0 4px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: clamp(8px, .85vw, 10px);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 0;
      color: #f7f4ed;
      font-family: "Cinzel", serif;
      font-size: clamp(13px, 1.8vw, 22px);
      font-weight: 500;
      letter-spacing: .6px;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 4px 82px;
      overflow: hidden;
    }

    #book {
      position: relative;
      flex: 0 0 auto;
      margin: auto;
      transform: scale(var(--fit-scale, 1));
      transform-origin: center center;
      transition: transform .28s ease;
      will-change: transform;
    }

    #book.zoomed {
      transform: scale(calc(var(--fit-scale, 1) * 1.45));
    }

    #book .page {
      overflow: hidden;
      background: #f5f1e9;
    }

    #book .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      background: rgba(17, 17, 16, .9);
      text-align: center;
      font-size: 12px;
    }

    .loading.hidden { display: none; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(197, 160, 89, .2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      display: none;
      position: relative;
      z-index: 6;
      max-width: 650px;
      margin: auto;
      padding: 18px;
      border: 1px solid #875b4e;
      border-radius: 8px;
      color: #f0d1c7;
      background: #261916;
      font-size: 12px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .error.visible { display: block; }

    .status {
      position: absolute;
      top: 8px;
      left: 50%;
      z-index: 2;
      max-width: calc(100% - 20px);
      transform: translateX(-50%);
      color: rgba(235, 229, 216, .58);
      text-align: center;
      font-size: 9px;
      pointer-events: none;
    }

    /* Floating glass control dock */

    .control-dock {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 20px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px;
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
      backdrop-filter: blur(22px) saturate(145%);
      box-shadow:
        0 8px 35px rgba(0, 0, 0, .42),
        inset 0 1px 0 rgba(255, 255, 255, .07),
        0 0 18px rgba(197, 160, 89, .045);
    }

    .dock-btn {
      min-width: 40px;
      min-height: 39px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #eee9df;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s, transform .2s;
    }

    .dock-btn:hover:not(:disabled),
    .dock-btn.active {
      color: var(--gold-light);
      border-color: rgba(197, 160, 89, .42);
      background: rgba(197, 160, 89, .14);
    }

    .dock-btn:active:not(:disabled) { transform: scale(.95); }
    .dock-btn:disabled { opacity: .3; cursor: not-allowed; }

    .dock-btn svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-counter {
      min-width: 65px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
      padding: 0 7px;
      color: var(--gold-light);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .page-counter .current { font-size: 16px; font-weight: 600; }
    .page-counter .slash { color: rgba(255, 255, 255, .42); }

    .dock-divider {
      width: 1px;
      height: 25px;
      flex: 0 0 auto;
      margin: 0 2px;
      background: rgba(255, 255, 255, .13);
    }

    @media (max-width: 600px) {
      .topbar { padding: 7px 9px; gap: 5px; }
      .brand-name { font-size: 12px; letter-spacing: .6px; }
      .brand-subtitle { font-size: 7px; letter-spacing: .7px; }
      .top-actions { gap: 4px; }
      .top-btn { min-height: 31px; padding: 6px 8px; font-size: 10px; }
      .top-btn .btn-label { display: none; }
      .main { padding: 5px 3px 0; }
      .heading { padding-bottom: 2px; }
      .eyebrow { letter-spacing: 1.5px; }
      h1 { font-size: 13px; }
      .stage { padding: 4px 2px 70px; }

      .control-dock {
        bottom: max(8px, env(safe-area-inset-bottom));
        gap: 3px;
        padding: 6px;
        border-radius: 13px;
      }

      .dock-btn { min-width: 34px; min-height: 36px; padding: 7px; }
      .dock-btn svg { width: 16px; height: 16px; }
      .dock-btn .btn-label { display: none; }
      .page-counter { min-width: 52px; gap: 3px; padding: 0 3px; font-size: 11px; }
      .page-counter .current { font-size: 14px; }
      .dock-divider { height: 22px; margin: 0 1px; }
      .status { top: 4px; font-size: 8px; }
    }

    @media (max-width: 360px) {
      .brand-name { font-size: 10px; }
      .brand-subtitle { font-size: 6px; letter-spacing: 0; }
      .topbar { padding: 5px; }
      .control-dock { gap: 2px; padding: 5px; }
      .dock-btn { min-width: 31px; min-height: 33px; padding: 5px; }
      .page-counter { min-width: 46px; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .topbar { padding: 4px 10px; }
      .brand-subtitle, .heading { display: none; }
      .main { padding-top: 2px; }
      .stage { padding-bottom: 58px; }
      .control-dock { bottom: max(5px, env(safe-area-inset-bottom)); padding: 4px; }
      .dock-btn { min-height: 31px; padding: 5px 7px; }
      .status { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-name">RADISSON BLU</div>
        <div class="brand-subtitle">Gorakhpur · Meetings & Events</div>
      </div>

      <div class="top-actions">
        <button class="top-btn" id="sound-btn" type="button" aria-pressed="true" title="Toggle page-turn sound" aria-label="Toggle page-turn sound">
          <span id="sound-icon" aria-hidden="true">♪</span>
          <span class="btn-label" id="sound-label">Sound On</span>
        </button>

        <button class="top-btn" id="fullscreen-btn" type="button" aria-pressed="false" title="Toggle fullscreen" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>
          </svg>
          <span class="btn-label">Fullscreen</span>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="heading">
        <div class="eyebrow">Discover Extraordinary Experiences</div>
        <h1>Meetings & Events Brochure</h1>
      </section>

      <section class="stage" id="stage" aria-label="Interactive brochure">
        <div class="status" id="status" aria-live="polite">Preparing your brochure…</div>

        <div class="loading" id="loading" role="status">
          <div class="spinner"></div>
          <div id="loading-text">Loading brochure pages…</div>
        </div>

        <div class="error" id="error" role="alert"></div>
        <div id="book"></div>
      </section>

      <nav class="control-dock" aria-label="Brochure controls">
        <button class="dock-btn" id="first-btn" type="button" title="First page" aria-label="First page" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 6l-9 6 9 6z"/></svg>
          <span class="btn-label">First</span>
        </button>

        <button class="dock-btn" id="prev-btn" type="button" title="Previous page" aria-label="Previous page" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span class="btn-label">Prev</span>
        </button>

        <div class="dock-divider" aria-hidden="true"></div>

        <div class="page-counter" aria-live="polite" aria-atomic="true" aria-label="Current page">
          <span class="current" id="current-page">1</span>
          <span class="slash">/</span>
          <span id="total-pages">14</span>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <button class="dock-btn" id="next-btn" type="button" title="Next page" aria-label="Next page" disabled>
          <span class="btn-label">Next</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <button class="dock-btn" id="last-btn" type="button" title="Last page" aria-label="Last page" disabled>
          <span class="btn-label">Last</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 6l9 6-9 6z"/></svg>
        </button>

        <div class="dock-divider" aria-hidden="true"></div>

        <button class="dock-btn" id="zoom-btn" type="button" title="Zoom in" aria-label="Zoom in" aria-pressed="false">
          <svg id="zoom-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="m16 16 4.5 4.5M10.8 7.5v6.6M7.5 10.8h6.6"/>
          </svg>
          <span class="btn-label" id="zoom-label">Zoom</span>
        </button>

        <button class="dock-btn" id="dock-fullscreen-btn" type="button" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg>
          <span class="btn-label">Full</span>
        </button>
      </nav>
    </main>
  </div>

  <script>
    "use strict";

    const TOTAL_PAGES = 14;
    const PAGE_IMAGES = Array.from({ length: TOTAL_PAGES }, (_, i) => `./Page ${i + 1}.jpg`);

    const app = document.getElementById("app");
    const stage = document.getElementById("stage");
    const bookElement = document.getElementById("book");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loading-text");
    const errorBox = document.getElementById("error");
    const statusBox = document.getElementById("status");

    const currentPageText = document.getElementById("current-page");
    document.getElementById("total-pages").textContent = TOTAL_PAGES;

    const firstBtn = document.getElementById("first-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const lastBtn = document.getElementById("last-btn");

    const soundBtn = document.getElementById("sound-btn");
    const soundIcon = document.getElementById("sound-icon");
    const soundLabel = document.getElementById("sound-label");

    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const dockFullscreenBtn = document.getElementById("dock-fullscreen-btn");

    const zoomBtn = document.getElementById("zoom-btn");
    const zoomLabel = document.getElementById("zoom-label");
    const zoomIcon = document.getElementById("zoom-icon");

    let pageFlip = null;
    let initialized = false;
    let soundEnabled = true;
    let zoomed = false;
    let audioContext = null;
    let imageRatio = 4 / 3;
    let fitTimer = null;
    let lastSoundTime = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Unable to load image: ${src}`));
        image.src = src;
      });
    }

    function currentIndex() {
      if (!pageFlip || !initialized) return 0;
      try {
        return pageFlip.getCurrentPageIndex();
      } catch (_) {
        return 0;
      }
    }

    function updateControls(index) {
      const i = Math.max(0, Math.min(TOTAL_PAGES - 1, Number(index) || 0));
      currentPageText.textContent = String(i + 1);
      firstBtn.disabled = !initialized || i === 0;
      prevBtn.disabled = !initialized || i === 0;
      nextBtn.disabled = !initialized || i >= TOTAL_PAGES - 1;
      lastBtn.disabled = !initialized || i >= TOTAL_PAGES - 1;
    }

    function goToPage(index) {
      if (!pageFlip || !initialized) return;
      const target = Math.max(0, Math.min(TOTAL_PAGES - 1, index));
      if (target !== currentIndex()) pageFlip.flip(target);
    }

    firstBtn.addEventListener("click", () => goToPage(0));
    prevBtn.addEventListener("click", () => {
      if (pageFlip && initialized) pageFlip.flipPrev();
    });
    nextBtn.addEventListener("click", () => {
      if (pageFlip && initialized) pageFlip.flipNext();
    });
    lastBtn.addEventListener("click", () => goToPage(TOTAL_PAGES - 1));

    /* Paper-curl sound */

    function initializeAudio() {
      if (!soundEnabled) return;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!audioContext) audioContext = new AudioCtx();
        if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
      } catch (_) {}
    }

    function makeNoiseBuffer(duration) {
      const length = Math.max(1, Math.floor(audioContext.sampleRate * duration));
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      return buffer;
    }

    function playPaperCurlSound() {
      if (!soundEnabled) return;

      initializeAudio();
      if (!audioContext || audioContext.state !== "running") return;

      const nowMs = performance.now();
      if (nowMs - lastSoundTime < 180) return;
      lastSoundTime = nowMs;

      try {
        const ctx = audioContext;
        const now = ctx.currentTime;

        // Initial flutter.
        const flutterDuration = .12;
        const flutter = ctx.createBufferSource();
        const flutterFilter = ctx.createBiquadFilter();
        const flutterGain = ctx.createGain();

        flutter.buffer = makeNoiseBuffer(flutterDuration);
        flutterFilter.type = "highpass";
        flutterFilter.frequency.setValueAtTime(850, now);
        flutterFilter.frequency.exponentialRampToValueAtTime(1500, now + .045);
        flutterFilter.frequency.exponentialRampToValueAtTime(600, now + flutterDuration);

        flutterGain.gain.setValueAtTime(.0001, now);
        flutterGain.gain.exponentialRampToValueAtTime(.07, now + .012);
        flutterGain.gain.exponentialRampToValueAtTime(.0001, now + flutterDuration);

        flutter.connect(flutterFilter);
        flutterFilter.connect(flutterGain);
        flutterGain.connect(ctx.destination);
        flutter.start(now);
        flutter.stop(now + flutterDuration);

        // Main paper sweep.
        const sweepDuration = .36;
        const sweep = ctx.createBufferSource();
        const sweepFilter = ctx.createBiquadFilter();
        const sweepGain = ctx.createGain();

        sweep.buffer = makeNoiseBuffer(sweepDuration);
        sweepFilter.type = "bandpass";
        sweepFilter.Q.value = .7;
        sweepFilter.frequency.setValueAtTime(2100, now + .012);
        sweepFilter.frequency.exponentialRampToValueAtTime(720, now + sweepDuration);

        sweepGain.gain.setValueAtTime(.0001, now);
        sweepGain.gain.exponentialRampToValueAtTime(.12, now + .035);
        sweepGain.gain.setValueAtTime(.065, now + .12);
        sweepGain.gain.exponentialRampToValueAtTime(.0001, now + sweepDuration);

        sweep.connect(sweepFilter);
        sweepFilter.connect(sweepGain);
        sweepGain.connect(ctx.destination);
        sweep.start(now + .008);
        sweep.stop(now + sweepDuration);

        // Lower-frequency page movement.
        const bodyDuration = .23;
        const body = ctx.createBufferSource();
        const bodyFilter = ctx.createBiquadFilter();
        const bodyGain = ctx.createGain();

        body.buffer = makeNoiseBuffer(bodyDuration);
        bodyFilter.type = "lowpass";
        bodyFilter.frequency.setValueAtTime(500, now);
        bodyFilter.frequency.exponentialRampToValueAtTime(180, now + bodyDuration);

        bodyGain.gain.setValueAtTime(.0001, now);
        bodyGain.gain.exponentialRampToValueAtTime(.045, now + .014);
        bodyGain.gain.exponentialRampToValueAtTime(.0001, now + bodyDuration);

        body.connect(bodyFilter);
        bodyFilter.connect(bodyGain);
        bodyGain.connect(ctx.destination);
        body.start(now);
        body.stop(now + bodyDuration);
      } catch (_) {}
    }

    function updateSoundButton() {
      soundBtn.classList.toggle("active", soundEnabled);
      soundBtn.setAttribute("aria-pressed", String(soundEnabled));
      soundBtn.setAttribute("aria-label", soundEnabled ? "Turn page sound off" : "Turn page sound on");
      soundIcon.textContent = soundEnabled ? "♪" : "♫";
      soundLabel.textContent = soundEnabled ? "Sound On" : "Sound Off";
    }

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) initializeAudio();
      updateSoundButton();
      setStatus(soundEnabled ? "Page-turn sound enabled." : "Page-turn sound muted.");
    });

    document.addEventListener("pointerdown", initializeAudio, { once: true });

    /* Zoom */

    function updateZoomButton() {
      bookElement.classList.toggle("zoomed", zoomed);
      zoomBtn.classList.toggle("active", zoomed);
      zoomBtn.setAttribute("aria-pressed", String(zoomed));
      zoomBtn.setAttribute("aria-label", zoomed ? "Return to normal size" : "Zoom in");
      zoomBtn.title = zoomed ? "Return to normal size" : "Zoom in";
      zoomLabel.textContent = zoomed ? "Reset" : "Zoom";

      zoomIcon.innerHTML = zoomed
        ? '<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M7.5 10.8h6.6"/>'
        : '<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M10.8 7.5v6.6M7.5 10.8h6.6"/>';
    }

    zoomBtn.addEventListener("click", () => {
      zoomed = !zoomed;
      updateZoomButton();
      setStatus(zoomed ? "Zoom set to 145%. Select Reset to return to normal size." : "Normal brochure view.");
    });

    /* Keep the existing PageFlip instance alive on fullscreen changes.
       Scale the rendered book to fit the new stage dimensions. */

    function fitBookToStage() {
      if (!pageFlip || !initialized) return;

      const stageRect = stage.getBoundingClientRect();
      const availableWidth = Math.max(100, stageRect.width - 20);
      const availableHeight = Math.max(100, stageRect.height - 100);

      // Use the actual book dimensions, not the viewport dimensions.
      const bookWidth = bookElement.offsetWidth;
      const bookHeight = bookElement.offsetHeight;

      if (!bookWidth || !bookHeight) return;

      const fitScale = Math.min(
        availableWidth / bookWidth,
        availableHeight / bookHeight
      );

      bookElement.style.setProperty("--fit-scale", String(Math.max(.1, fitScale)));
      loading.classList.add("hidden");
    }

    function scheduleFit() {
      clearTimeout(fitTimer);

      fitTimer = setTimeout(() => {
        requestAnimationFrame(() => {
          fitBookToStage();
        });
      }, 250);
    }

    window.addEventListener("resize", scheduleFit);
    window.addEventListener("orientationchange", scheduleFit);

    if ("ResizeObserver" in window) {
      const stageObserver = new ResizeObserver(() => scheduleFit());
      stageObserver.observe(stage);
    }

    /* Fullscreen controls */

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (app.requestFullscreen) {
            await app.requestFullscreen();
          } else {
            setStatus("Fullscreen is not supported by this browser.");
          }
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen error:", error);
        setStatus("Fullscreen is unavailable in this browser.");
      }
    }

    fullscreenBtn.addEventListener("click", toggleFullscreen);
    dockFullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", () => {
      const active = Boolean(document.fullscreenElement);

      fullscreenBtn.classList.toggle("active", active);
      dockFullscreenBtn.classList.toggle("active", active);

      fullscreenBtn.setAttribute("aria-pressed", String(active));
      dockFullscreenBtn.setAttribute("aria-pressed", String(active));

      // Do not destroy or reload PageFlip here.
      scheduleFit();
    });

    /* Keyboard navigation */

    document.addEventListener("keydown", event => {
      const target = event.target;

      if (
        event.altKey ||
        event.ctrlKey ||
        event.metaKey ||
        (target && target.closest &&
          target.closest("button, input, textarea, select"))
      ) return;

      if (!pageFlip || !initialized) return;

      switch (event.key) {
        case "ArrowRight":
          event.preventDefault();
          pageFlip.flipNext();
          break;

        case "ArrowLeft":
          event.preventDefault();
          pageFlip.flipPrev();
          break;

        case "Home":
          event.preventDefault();
          goToPage(0);
          break;

        case "End":
          event.preventDefault();
          goToPage(TOTAL_PAGES - 1);
          break;

        case "Escape":
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }
          break;

        case "+":
        case "=":
          zoomed = true;
          updateZoomButton();
          break;

        case "-":
          zoomed = false;
          updateZoomButton();
          break;
      }
    });

    /* Build the brochure once */

    async function initialize() {
      loading.classList.remove("hidden");
      errorBox.classList.remove("visible");
      loadingText.textContent = "Loading brochure pages…";
      setStatus("Preparing your brochure…");

      try {
        const images = await Promise.all(PAGE_IMAGES.map(loadImage));
        const firstImage = images[0];

        imageRatio = firstImage.naturalWidth && firstImage.naturalHeight
          ? firstImage.naturalWidth / firstImage.naturalHeight
          : 4 / 3;

        if (!Number.isFinite(imageRatio) || imageRatio <= 0) {
          imageRatio = 4 / 3;
        }

        if (!window.St || typeof window.St.PageFlip !== "function") {
          throw new Error("PageFlip library did not load. Check your internet connection.");
        }

        const stageRect = stage.getBoundingClientRect();
        const availableWidth = Math.max(100, stageRect.width - 20);
        const availableHeight = Math.max(100, stageRect.height - 100);

        const mobile = window.matchMedia("(max-width: 600px)").matches;
        const landscape = window.matchMedia("(orientation: landscape)").matches;
        const spread = !mobile && landscape &&
          availableWidth / availableHeight >= 1.55;

        const visiblePages = spread ? 2 : 1;
        const pageHeight = Math.min(
          availableHeight,
          availableWidth / visiblePages / imageRatio
        );
        const pageWidth = pageHeight * imageRatio;

        const width = Math.max(100, Math.floor(pageWidth));
        const height = Math.max(100, Math.floor(pageHeight));

        bookElement.style.width = `${width * visiblePages}px`;
        bookElement.style.height = `${height}px`;

        bookElement.innerHTML = "";

        PAGE_IMAGES.forEach((src, index) => {
          const page = document.createElement("div");
          page.className = "page";

          const image = document.createElement("img");
          image.src = src;
          image.alt = `Meetings & Events brochure page ${index + 1}`;
          image.draggable = false;
          image.decoding = "async";

          page.appendChild(image);
          bookElement.appendChild(page);
        });

        pageFlip = new window.St.PageFlip(bookElement, {
          width,
          height,
          size: "fixed",
          minWidth: width,
          maxWidth: width,
          minHeight: height,
          maxHeight: height,
          startPage: 0,
          showCover: true,
          usePortrait: !spread,
          drawShadow: true,
          maxShadowOpacity: .38,
          flippingTime: 850,
          autoSize: false,
          mobileScrollSupport: false,
          showPageCorners: true,
          disableFlipByClick: false,
          useMouseEvents: true,
          swipeDistance: 25
        });

        pageFlip.on("init", () => {
          initialized = true;
          loading.classList.add("hidden");
          errorBox.classList.remove("visible");
          updateControls(currentIndex());

          // First fit happens after PageFlip has rendered its wrapper.
          requestAnimationFrame(() => {
            fitBookToStage();
            scheduleFit();
          });

          setStatus("Turn the pages to explore our brochure.");
        });

        pageFlip.on("changeState", event => {
          if (event && event.data === "flipping") {
            playPaperCurlSound();
            setStatus("Turning page…");
          } else {
            setStatus("Explore the brochure.");
          }
        });

        pageFlip.on("flip", event => {
          const index = event && typeof event.data === "number"
            ? event.data
            : currentIndex();

          updateControls(index);
        });

        pageFlip.loadFromHTML(bookElement.querySelectorAll(".page"));
      } catch (error) {
        console.error(error);

        loading.classList.add("hidden");
        errorBox.classList.add("visible");
        errorBox.textContent =
          "The brochure could not be loaded. Check that Page 1.jpg through Page 14.jpg are in the same folder as index.html. The PageFlip library also requires an internet connection. Details: " +
          error.message;

        setStatus("Unable to load the brochure.");
      }
    }

    updateSoundButton();
    updateZoomButton();
    updateControls(0);
    initialize();
  </script>
</body>
</html>
