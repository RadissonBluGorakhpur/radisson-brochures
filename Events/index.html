<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings & Events | Radisson Blu Gorakhpur</title>
    <!-- Modern, stable flipbook library (No jQuery required) -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #222;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        .page {
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<!-- On-screen instructions -->
<div id="instructions">Swipe, drag corners, or use Left/Right arrow keys</div>

<!-- The book container -->
<div id="flipbook"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const flipbookEl = document.getElementById('flipbook');
        
        // --- CHANGE THIS NUMBER FOR YOUR OTHER FOLDERS ---
        const totalPages = 14; 

        // 1. Inject the pages automatically
        for (let i = 1; i <= totalPages; i++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            // %20 handles the spaces in file names. The onerror catches extension issues.
            pageDiv.innerHTML = '<img src="Page%20' + i + '.jpg" onerror="this.src=\'Page%20' + i + '.JPG\'" alt="Page ' + i + '">';
            flipbookEl.appendChild(pageDiv);
        }

        // 2. Initialize the modern PageFlip engine
        const pageFlip = new St.PageFlip(flipbookEl, {
            width: 500, // Base width
            height: 500, // Base height (1:1 ratio for your 210x210mm brochure)
            size: "fit", // Automatically fits the screen flawlessly
            minWidth: 300,
            maxWidth: 1000,
            minHeight: 300,
            maxHeight: 1000,
            showCover: true, // Makes Page 1 a hard cover
            mobileScrollSupport: false,
            usePortrait: true // Auto-switches to single page on phones
        });

        // Load the pages into the book
        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        // Keyboard controls
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 37) pageFlip.flipPrev();
            if (e.keyCode === 39) pageFlip.flipNext();
        });

        // Hide instructions once the user turns a page
        pageFlip.on('flip', function() {
            document.getElementById('instructions').style.display = 'none';
        });
    });
</script>

</body>
</html>
