<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings & Events | Radisson Blu Gorakhpur</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #2b2b2b 0%, #121212 100%);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #e0e0e0;
        }
        header {
            width: 100%;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            z-index: 200;
        }
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2.5px;
            color: #c5a059;
            text-transform: uppercase;
            font-weight: 600;
        }
        .brand-sub {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #aaa;
            text-transform: uppercase;
        }
        #book-viewport {
            width: 90vw;
            height: 76vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }
        .book {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-sheet {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .page-sheet.active {
            display: flex;
        }
        .page-sheet img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .controls-dock {
            margin-bottom: 18px;
            padding: 8px 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(25, 25, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            z-index: 200;
        }
        .btn {
            background: transparent;
            color: #e0e0e0;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(197, 160, 89, 0.2);
            color: #c5a059;
        }
        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.15);
        }
        #pageCounter {
            font-size: 12px;
            font-weight: 600;
            color: #c5a059;
            min-width: 55px;
            text-align: center;
            letter-spacing: 1px;
        }
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 15, 15, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #welcome-overlay h1 {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        #welcome-overlay p {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .enter-btn {
            margin-top: 25px;
            background: #c5a059;
            color: #121212;
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1.5px;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
        }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <h1>RADISSON BLU GORAKHPUR</h1>
    <p>Meetings & Events Dossier</p>
    <button class="enter-btn">Open Brochure</button>
</div>

<header>
    <div class="brand-title">RADISSON BLU GORAKHPUR</div>
    <div class="brand-sub">Meetings & Events</div>
</header>

<div id="book-viewport">
    <div class="book" id="bookContainer"></div>
</div>

<div class="controls-dock">
    <button class="btn" id="prevBtn">&#8592; Prev</button>
    <span id="pageCounter">1 / 14</span>
    <button class="btn" id="nextBtn">Next &#8594;</button>
    <div class="divider"></div>
    <button class="btn" id="soundBtn">🔊 Sound: On</button>
    <button class="btn" id="fsBtn">&#x26F6; Fullscreen</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const totalPages = 14;
        let currentIndex = 0;
        let soundEnabled = true;
        let audioCtx = null;
        
        const bookContainer = document.getElementById('bookContainer');
        const pageCounter = document.getElementById('pageCounter');
        const overlay = document.getElementById('welcome-overlay');

        // Generate pages
        for (let i = 1; i <= totalPages; i++) {
            const sheet = document.createElement('div');
            sheet.className = 'page-sheet' + (i === 1 ? ' active' : '');
            sheet.innerHTML = '<img src="Page%20' + i + '.jpg" alt="Page ' + i + '">';
            bookContainer.appendChild(sheet);
        }

        const sheets = document.querySelectorAll('.page-sheet');

        // Crisp mechanical paper-turn click sound (replaces fuzzy white-noise)
        function playCrispFlipSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Quick frequency drop for a realistic paper snap/thump click
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(280, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function goToPage(index) {
            sheets[currentIndex].classList.remove('active');
            currentIndex = index;
            sheets[currentIndex].classList.add('active');
            pageCounter.textContent = (currentIndex + 1) + ' / ' + totalPages;
            playCrispFlipSound();
        }

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            playCrispFlipSound();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            let next = (currentIndex + 1) % totalPages;
            goToPage(next);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            let prev = (currentIndex - 1 + totalPages) % totalPages;
            goToPage(prev);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                let next = (currentIndex + 1) % totalPages;
                goToPage(next);
            } else if (e.key === 'ArrowLeft') {
                let prev = (currentIndex - 1 + totalPages) % totalPages;
                goToPage(prev);
            }
        });

        const soundBtn = document.getElementById('soundBtn');
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
        });

        document.getElementById('fsBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });
    });
</script>

</body>
</html>
