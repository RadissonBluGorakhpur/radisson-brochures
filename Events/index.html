<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meetings & Events | Radisson Blu Gorakhpur</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #book-wrapper {
            width: 92vw;
            height: 82vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page {
            background-color: #ffffff;
            overflow: hidden;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background-color: #ffffff;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            color: #ccc;
            font-size: 14px;
            z-index: 100;
        }
        .btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:hover { background: #555; }
    </style>
</head>
<body>

<div id="book-wrapper">
    <div id="flipbook"></div>
</div>

<div class="controls">
    <button class="btn" id="prevBtn">&#8592; Prev</button>
    <span id="pageInfo">Swipe or click corners to flip</span>
    <button class="btn" id="nextBtn">Next &#8594;</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const flipbookEl = document.getElementById('flipbook');
        const totalPages = 14;

        for (let i = 1; i <= totalPages; i++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            if (i === 1 || i === totalPages) {
                pageDiv.setAttribute('data-density', 'hard');
            }
            pageDiv.innerHTML = '<img src="Page%20' + i + '.jpg" alt="Page ' + i + '">';
            flipbookEl.appendChild(pageDiv);
        }

        const pageFlip = new St.PageFlip(flipbookEl, {
            width: 600,
            height: 450,
            size: "stretch",
            minWidth: 280,
            maxWidth: 1200,
            minHeight: 210,
            maxHeight: 900,
            maxShadowOpacity: 0.5,
            showCover: true,
            mobileScrollSupport: false,
            usePortrait: true
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') pageFlip.flipPrev();
            if (e.key === 'ArrowRight') pageFlip.flipNext();
        });
    });
</script>

</body>
</html>
