<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meetings & Events | Radisson Blu Gorakhpur</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Using alternative cdnjs link to bypass blocking filters -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/page-flip/2.0.7/js/page-flip.browser.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at center, #2b2b2b 0%, #121212 100%);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #e0e0e0;
        }
        header {
            width: 100%;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            z-index: 200;
        }
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2.5px;
            color: #c5a059;
            text-transform: uppercase;
            font-weight: 600;
        }
        .brand-sub {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #aaa;
            text-transform: uppercase;
        }
        #book-wrapper {
            width: 92vw;
            height: 78vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #book-wrapper.zoomed {
            transform: scale(1.45);
        }
        .page {
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background-color: #ffffff;
            pointer-events: none;
        }
        .controls-dock {
            margin-bottom: 18px;
            padding: 8px 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(25, 25, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            z-index: 200;
        }
        .btn {
            background: transparent;
            color: #e0e0e0;
            border: none;
            padding: 7px 13px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(197, 160, 89, 0.2);
            color: #c5a059;
        }
        .btn.active {
            background: #c5a059;
            color: #121212;
            font-weight: 600;
        }
        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.15);
        }
        #pageCounter {
            font-size: 12px;
            font-weight: 600;
            color: #c5a059;
            min-width: 55px;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand-title">RADISSON BLU GORAKHPUR</div>
    <div class="brand-sub">Meetings & Events</div>
</header>

<div id="book-wrapper">
    <div id="flipbook"></div>
</div>

<div class="controls-dock">
    <button class="btn" id="prevBtn">&#8592; Prev</button>
    <span id="pageCounter">1 / 14</span>
    <button class="btn" id="nextBtn">Next &#8594;</button>
    <div class="divider"></div>
    <button class="btn" id="zoomBtn">Zoom</button>
    <button class="btn active" id="soundBtn">Sound</button>
    <button class="btn" id="fsBtn">&#x26F6;</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const totalPages = 14;
        const flipbookEl = document.getElementById('flipbook');
        const bookWrapper = document.getElementById('book-wrapper');
        const pageCounter = document.getElementById('pageCounter');

        for (let i = 1; i <= totalPages; i++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            if (i === 1 || i === totalPages) {
                pageDiv.setAttribute('data-density', 'hard');
            }
            pageDiv.innerHTML = '<img src="Page%20' + i + '.jpg" alt="Page ' + i + '">';
            flipbookEl.appendChild(pageDiv);
        }

        // Wait a split second to ensure library is fully parsed
        setTimeout(() => {
            if (typeof St === 'undefined' || !St.PageFlip) {
                alert('Flipbook engine loading error. Please check network/adblocker settings.');
                return;
            }

            const pageFlip = new St.PageFlip(flipbookEl, {
                width: 600,
                height: 450,
                size: "stretch",
                minWidth: 280,
                maxWidth: 1200,
                minHeight: 210,
                maxHeight: 900,
                maxShadowOpacity: 0.6,
                showCover: true,
                mobileScrollSupport: false,
                usePortrait: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // Audio & controls setup
            let soundEnabled = true;
            let audioCtx = null;
            function playFlipSound() {
                if (!soundEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const duration = 0.22;
                    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < buffer.length; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.sin((i/buffer.length) * Math.PI) * 0.28;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 900;
                    noise.connect(filter);
                    filter.connect(audioCtx.destination);
                    noise.start();
                } catch(e) {}
            }

            pageFlip.on('flip', (e) => {
                playFlipSound();
                pageCounter.textContent = (e.data + 1) + ' / ' + totalPages;
            });

            document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
            document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());

            let isZoomed = false;
            document.getElementById('zoomBtn').addEventListener('click', () => {
                isZoomed = !isZoomed;
                bookWrapper.classList.toggle('zoomed', isZoomed);
                document.getElementById('zoomBtn').classList.toggle('active', isZoomed);
            });

            document.getElementById('soundBtn').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.getElementById('soundBtn').classList.toggle('active', soundEnabled);
                document.getElementById('soundBtn').textContent = soundEnabled ? 'Sound' : 'Muted';
            });

            document.getElementById('fsBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });
        }, 300);
    });
</script>

</body>
</html>
