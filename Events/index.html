
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="description" content="Meetings & Events at Radisson Blu Gorakhpur">
  <title>Meetings &amp; Events | Radisson Blu Gorakhpur</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #c5a059;
      --gold-light: #e2c58b;
      --panel: rgba(25,25,25,.86);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Montserrat, Arial, sans-serif;
      color: #eee;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #303030 0%, #1b1b1b 42%, #101010 100%);
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto auto;
      isolation: isolate;
    }

    .app:fullscreen {
      height: 100%;
      background: #101010;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 13px clamp(14px,3vw,34px);
      background: rgba(12,12,12,.72);
      border-bottom: 1px solid #c5a05955;
      backdrop-filter: blur(12px);
      z-index: 5;
    }

    .brand {
      font: 600 clamp(11px,1.15vw,15px) Cinzel,serif;
      letter-spacing: clamp(1px,.2vw,2.5px);
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #bcbcbc;
      text-align: right;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 14px 4vw 18px;
      perspective: 1800px;
    }

    .book-shell {
      width: min(100%,1400px);
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #book {
      margin: auto;
      box-shadow: 0 22px 70px #0009;
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .loading {
      position: absolute;
      z-index: 2;
      color: #d7c39b;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status {
      position: absolute;
      left: 50%;
      bottom: 4px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }

    .toolbar-wrap {
      display: flex;
      justify-content: center;
      padding: 7px 12px 9px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid #c5a05966;
      border-radius: 40px;
      box-shadow: 0 8px 30px #0006;
      max-width: calc(100vw - 20px);
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 24px;
      background: transparent;
      color: #eee;
      padding: 9px 13px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s,border-color .2s,color .2s;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled),
    .btn:focus-visible,
    .btn.active {
      background: #c5a05929;
      border-color: #c5a05966;
      color: var(--gold-light);
      outline: none;
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .counter {
      min-width: 68px;
      text-align: center;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 1px;
      height: 22px;
      background: #ffffff26;
      margin: 0 2px;
    }

    .thumbbar {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 8px 18px 13px;
      scrollbar-width: thin;
      scrollbar-color: #806637 transparent;
      background: #00000029;
    }

    .thumb {
      flex: 0 0 auto;
      width: 56px;
      height: 42px;
      padding: 2px;
      border: 1px solid #ffffff33;
      border-radius: 4px;
      background: #222;
      cursor: pointer;
      opacity: .68;
      transition: opacity .2s,border-color .2s,transform .2s;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .thumb:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    .thumb.active {
      opacity: 1;
      border: 2px solid var(--gold);
      box-shadow: 0 0 0 1px #c5a05933;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at center,#272727f0,#0a0a0afc);
      backdrop-filter: blur(12px);
      transition: opacity .45s,visibility .45s;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card { max-width: 620px; }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .welcome-card h1 {
      font: 600 clamp(23px,4vw,42px)/1.25 Cinzel,serif;
      letter-spacing: 2px;
      color: var(--gold-light);
      margin: 0 0 12px;
    }

    .welcome-card p {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #b9b9b9;
      margin: 0;
    }

    .enter {
      margin-top: 30px;
      border: 1px solid var(--gold);
      background: linear-gradient(135deg,#e1c17e,#b58a3f);
      color: #17130c;
      padding: 13px 27px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 28px #c5a05933;
    }

    .enter:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .error {
      position: fixed;
      z-index: 15;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      max-width: min(90vw,620px);
      padding: 12px 16px;
      border: 1px solid #8c6a35;
      border-radius: 8px;
      background: #211c14;
      color: #f3d9a6;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }

    @media(max-width:640px) {
      .topbar { padding: 12px 14px; }
      .subtitle { font-size: 9px; letter-spacing: 1px; }
      .stage { padding: 12px 4px 18px; }
      .toolbar-wrap { padding: 4px 7px 7px; }
      .toolbar { gap: 2px; padding: 6px; border-radius: 16px; width: 100%; }
      .btn { padding: 9px 8px; font-size: 10px; }
      .counter { min-width: 53px; font-size: 11px; }
      .divider { height: 18px; }
      .thumbbar { padding: 7px 10px 10px; gap: 6px; }
      .thumb { width: 48px; height: 36px; }
      .status { bottom: 4px; font-size: 9px; }
    }

    @media(max-height:520px) and (orientation:landscape) {
      .topbar { padding: 7px 18px; }
      .stage { padding: 4px 4vw 12px; }
      .toolbar-wrap { padding: 3px; }
      .thumbbar { padding: 4px 12px; }
      .thumb { width: 40px; height: 29px; }
      .btn { padding: 6px 10px; }
    }

    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>

<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">Radisson Blu Gorakhpur</div>
    <div class="subtitle">Meetings &amp; Events</div>
  </header>

  <main class="stage" aria-label="Digital brochure">
    <div class="book-shell">
      <div id="book" aria-live="polite"></div>
      <div class="loading" id="loading">Preparing your brochure…</div>
    </div>
    <div class="status" id="status">Use arrows, swipe, or the controls to turn pages</div>
  </main>

  <div class="toolbar-wrap">
    <nav class="toolbar" aria-label="Brochure controls">
      <button class="btn" id="firstBtn" title="First page" aria-label="First page">|&#8592;</button>
      <button class="btn" id="prevBtn" title="Previous page" aria-label="Previous page">&#8592; Prev</button>
      <span class="counter" id="pageCounter">1 / 14</span>
      <button class="btn" id="nextBtn" title="Next page" aria-label="Next page">Next &#8594;</button>
      <button class="btn" id="lastBtn" title="Last page" aria-label="Last page">&#8594;|</button>
      <span class="divider"></span>
      <button class="btn" id="thumbBtn" aria-expanded="true">Pages</button>
      <button class="btn active" id="soundBtn" aria-pressed="true" title="Toggle page-turn sound">♪ Sound On</button>
      <button class="btn" id="fsBtn" title="Toggle fullscreen">&#x26F6; Fullscreen</button>
    </nav>
  </div>

  <div class="thumbbar" id="thumbbar" aria-label="Choose a brochure page"></div>
</div>

<div class="overlay" id="welcome">
  <div class="welcome-card">
    <div class="eyebrow">A premium event experience</div>
    <h1>RADISSON BLU<br>GORAKHPUR</h1>
    <p>Meetings &amp; Events Dossier</p>
    <button class="enter" id="enterBtn">Open Brochure &nbsp; &#8594;</button>
  </div>
</div>

<div class="error" id="errorBox" role="alert"></div>

<script>
(() => {
  'use strict';

  const TOTAL = 14;

  const bookEl = document.getElementById('book');
  const loadingEl = document.getElementById('loading');
  const counterEl = document.getElementById('pageCounter');
  const thumbbar = document.getElementById('thumbbar');
  const errorBox = document.getElementById('errorBox');
  const welcome = document.getElementById('welcome');
  const statusEl = document.getElementById('status');
  const soundBtn = document.getElementById('soundBtn');

  let pageFlip = null;
  let current = 0;
  let thumbButtons = [];
  let soundEnabled = true;
  let lastSoundTime = 0;

  const pageUrl = n => `Page ${n}.jpg`;

  /* Natural paper-slide sound */
  const pageTurnSound = new Audio('./paper-slide.wav');
  pageTurnSound.preload = 'auto';
  pageTurnSound.volume = 0.55;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function setCurrent(index) {
    current = Math.max(0, Math.min(TOTAL - 1, index));

    counterEl.textContent = `${current + 1} / ${TOTAL}`;

    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('firstBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === TOTAL - 1;
    document.getElementById('lastBtn').disabled = current === TOTAL - 1;

    thumbButtons.forEach((button, i) => {
      button.classList.toggle('active', i === current);
      button.setAttribute('aria-current', i === current ? 'page' : 'false');
    });

    const active = thumbButtons[current];

    if (active) {
      active.scrollIntoView({
        block: 'nearest',
        inline: 'nearest',
        behavior: 'smooth'
      });
    }
  }

  function playPaperSlide() {
    if (!soundEnabled) return;

    const now = performance.now();

    // Prevent multiple sounds firing for the same page-turn action.
    if (now - lastSoundTime < 250) return;

    lastSoundTime = now;

    try {
      pageTurnSound.pause();
      pageTurnSound.currentTime = 0;

      const playback = pageTurnSound.play();

      if (playback && typeof playback.catch === 'function') {
        playback.catch(() => {
          // Browser playback restrictions are handled silently.
        });
      }
    } catch (_) {
      // Do not interrupt page turning if audio is unavailable.
    }
  }

  function updateSoundButton() {
    soundBtn.classList.toggle('active', soundEnabled);
    soundBtn.setAttribute('aria-pressed', String(soundEnabled));
    soundBtn.textContent = soundEnabled ? '♪ Sound On' : '♫ Sound Off';
  }

  function buildThumbnails() {
    for (let i = 1; i <= TOTAL; i++) {
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'thumb' + (i === 1 ? ' active' : '');
      button.title = `Go to page ${i}`;
      button.setAttribute('aria-label', `Go to page ${i}`);

      const img = document.createElement('img');
      img.src = pageUrl(i);
      img.alt = '';
      img.loading = i > 4 ? 'lazy' : 'eager';

      button.appendChild(img);

      button.addEventListener('click', () => {
        if (pageFlip) pageFlip.flip(i - 1);
      });

      thumbbar.appendChild(button);
      thumbButtons.push(button);
    }
  }

  function buildPages() {
    for (let i = 1; i <= TOTAL; i++) {
      const page = document.createElement('div');
      page.className = 'page';

      const img = document.createElement('img');
      img.src = pageUrl(i);
      img.alt = `Radisson Blu Gorakhpur Meetings & Events brochure — page ${i}`;
      img.draggable = false;
      img.decoding = 'async';

      if (i > 2) img.loading = 'lazy';

      img.onerror = () => {
        showError(
          `Could not load “Page ${i}.jpg”. Keep all 14 JPG files in the same folder as this HTML file and check the filenames exactly.`
        );
      };

      page.appendChild(img);
      bookEl.appendChild(page);
    }
  }

  function init() {
    buildThumbnails();
    buildPages();

    if (!window.St || !window.St.PageFlip) {
      loadingEl.textContent = 'Flipbook library could not load';
      showError(
        'The page-turning library did not load. Check your internet connection and reload.'
      );
      return;
    }

    pageFlip = new St.PageFlip(bookEl, {
      width: 560,
      height: 760,
      size: 'stretch',
      minWidth: 280,
      maxWidth: 1400,
      minHeight: 360,
      maxHeight: 1800,
      maxShadowOpacity: 0.42,
      showCover: true,
      mobileScrollSupport: true,
      usePortrait: true,
      drawShadow: true,
      flippingTime: 850,
      startPage: 0,
      startZIndex: 10,
      autoSize: true,
      clickEventForward: true,
      useMouseEvents: true,
      swipeDistance: 28,
      showPageCorners: true,
      disableFlipByClick: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

    pageFlip.on('changeState', event => {
      if (event && event.data === 'flipping') {
        playPaperSlide();
        statusEl.textContent = 'Turning page…';
      } else {
        statusEl.textContent = 'Use arrows, swipe, or the controls to turn pages';
      }
    });

    pageFlip.on('flip', event => {
      setCurrent(event.data);
    });

    pageFlip.on('init', () => {
      loadingEl.style.display = 'none';
      setCurrent(pageFlip.getCurrentPageIndex());
    });

    setCurrent(0);
  }

  document.getElementById('enterBtn').addEventListener('click', () => {
    welcome.classList.add('hidden');
  });

  welcome.addEventListener('click', event => {
    if (event.target === welcome) {
      welcome.classList.add('hidden');
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (pageFlip) pageFlip.flipPrev();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (pageFlip) pageFlip.flipNext();
  });

  document.getElementById('firstBtn').addEventListener('click', () => {
    if (pageFlip) pageFlip.flip(0);
  });

  document.getElementById('lastBtn').addEventListener('click', () => {
    if (pageFlip) pageFlip.flip(TOTAL - 1);
  });

  document.getElementById('thumbBtn').addEventListener('click', () => {
    const hidden = thumbbar.style.display === 'none';

    thumbbar.style.display = hidden ? 'flex' : 'none';

    document.getElementById('thumbBtn').setAttribute(
      'aria-expanded',
      String(hidden)
    );
  });

  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;

    if (!soundEnabled) {
      pageTurnSound.pause();
      pageTurnSound.currentTime = 0;
    }

    updateSoundButton();

    statusEl.textContent = soundEnabled
      ? 'Page-turn sound enabled.'
      : 'Page-turn sound muted.';
  });

  document.getElementById('fsBtn').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (_) {
      showError('Fullscreen is not available in this browser window.');
    }
  });

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;

    if (event.key === 'ArrowRight' || event.key === 'PageDown') {
      if (pageFlip) {
        event.preventDefault();
        pageFlip.flipNext();
      }
    } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      if (pageFlip) {
        event.preventDefault();
        pageFlip.flipPrev();
      }
    } else if (event.key === 'Home') {
      if (pageFlip) {
        event.preventDefault();
        pageFlip.flip(0);
      }
    } else if (event.key === 'End') {
      if (pageFlip) {
        event.preventDefault();
        pageFlip.flip(TOTAL - 1);
      }
    } else if (event.key === 'Escape') {
      welcome.classList.add('hidden');
    }
  });

  window.addEventListener('resize', () => {
    if (pageFlip && typeof pageFlip.update === 'function') {
      pageFlip.update();
    }
  });

  updateSoundButton();
  init();
})();
</script>
</body>
</html>
