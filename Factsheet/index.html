
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102c26">

  <title>Fact Sheet | Radisson Blu Gorakhpur</title>

  <!-- jQuery and Turn.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

  <style>
    :root {
      --green: #102c26;
      --gold: #c7a96b;
      --white: #ffffff;
      --muted: #c9d2ce;
      --control-bg: rgba(255, 255, 255, 0.09);
      --control-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--green);
      color: var(--white);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 66px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.13);
      background: var(--green);
      position: relative;
      z-index: 5;
    }

    .brand {
      min-width: 0;
    }

    .brand-name {
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }

    .page-indicator {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 18px 12px;
      gap: 18px;
    }

    .book-stage {
      width: 100%;
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #book {
      margin: 0 auto;
    }

    #book .page {
      background: #ffffff;
      overflow: hidden;
    }

    #book .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      padding-bottom: 2px;
    }

    .control-button {
      min-width: 43px;
      height: 41px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--white);
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: 5px;
      cursor: pointer;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        opacity 160ms ease;
    }

    .control-button:hover:not(:disabled) {
      background: rgba(199, 169, 107, 0.18);
      border-color: var(--gold);
    }

    .control-button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .control-button:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    .control-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .control-label {
      font-size: 12px;
    }

    .footer {
      padding: 10px 16px 15px;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .loading-message {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    .error-message {
      max-width: 560px;
      padding: 20px;
      line-height: 1.7;
      text-align: center;
      color: #ffffff;
    }

    .error-message strong {
      color: var(--gold);
    }

    body.fullscreen-mode .topbar,
    body.fullscreen-mode .footer {
      display: none;
    }

    body.fullscreen-mode .viewer {
      padding: 12px;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .topbar {
        min-height: 59px;
        padding: 12px 15px;
      }

      .brand-name {
        font-size: 12px;
        letter-spacing: 1.1px;
      }

      .brand-subtitle {
        font-size: 9px;
        letter-spacing: 1.6px;
      }

      .page-indicator {
        font-size: 11px;
      }

      .viewer {
        padding: 12px 8px 8px;
        gap: 13px;
      }

      .book-stage {
        min-height: 180px;
      }

      .controls {
        gap: 7px;
      }

      .control-button {
        min-width: 40px;
        height: 39px;
        padding: 0 10px;
      }

      .control-label {
        display: none;
      }

      .footer {
        padding: 8px 10px 12px;
        font-size: 9px;
      }
    }

    @media (max-height: 500px) {
      .topbar {
        min-height: 48px;
        padding: 7px 16px;
      }

      .viewer {
        padding-top: 8px;
        gap: 8px;
      }

      .control-button {
        height: 34px;
      }

      .footer {
        padding: 5px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-name">Radisson Blu Gorakhpur</div>
        <div class="brand-subtitle">Fact Sheet</div>
      </div>

      <div class="page-indicator" id="pageIndicator" aria-live="polite">
        Page 1 of 2
      </div>
    </header>

    <main class="viewer">
      <div class="book-stage" id="bookStage">
        <div class="loading-message" id="loadingMessage">
          Loading Fact Sheet…
        </div>
        <div id="book" hidden aria-label="Radisson Blu Gorakhpur Fact Sheet">
          <div class="page">
            <img
              src="./fact-sheet/Page%201.jpg"
              alt="Fact Sheet — Page 1"
              draggable="false"
            >
          </div>
          <div class="page">
            <img
              src="./fact-sheet/Page%202.jpg"
              alt="Fact Sheet — Page 2"
              draggable="false"
            >
          </div>
        </div>
      </div>

      <nav class="controls" aria-label="Fact Sheet navigation">
        <button class="control-button" id="firstBtn" aria-label="First page" title="First page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 10 12l8 6V6Z"></path>
            <path d="M5 5v14"></path>
          </svg>
        </button>

        <button class="control-button" id="prevBtn" aria-label="Previous page" title="Previous page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
          <span class="control-label">Previous</span>
        </button>

        <button class="control-button" id="nextBtn" aria-label="Next page" title="Next page">
          <span class="control-label">Next</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </button>

        <button class="control-button" id="lastBtn" aria-label="Last page" title="Last page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 8 6-8 6V6Z"></path>
            <path d="M19 5v14"></path>
          </svg>
        </button>

        <button class="control-button" id="soundBtn" aria-label="Toggle page-turn sound" title="Toggle page-turn sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
            <path d="M15 9a5 5 0 0 1 0 6"></path>
            <path d="M18 6a9 9 0 0 1 0 12"></path>
          </svg>
        </button>

        <button class="control-button" id="fullscreenBtn" aria-label="Enter fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
            <path d="M21 16v3a2 2 0 0 1-2 2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <span class="control-label">Fullscreen</span>
        </button>
      </nav>
    </main>

    <footer class="footer">
      Radisson Blu Gorakhpur · Fact Sheet
    </footer>
  </div>

  <!-- Local page-turn sound -->
  <audio id="pageSound" preload="auto">
    <source src="./fact-sheet/paper-slide.wav" type="audio/wav">
  </audio>

  <script>
    (() => {
      "use strict";

      const TOTAL_PAGES = 2;
      const IMAGE_WIDTH = 1200;
      const IMAGE_HEIGHT = 1697;

      const book = document.getElementById("book");
      const stage = document.getElementById("bookStage");
      const loadingMessage = document.getElementById("loadingMessage");
      const indicator = document.getElementById("pageIndicator");
      const sound = document.getElementById("pageSound");

      const firstBtn = document.getElementById("firstBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const lastBtn = document.getElementById("lastBtn");
      const soundBtn = document.getElementById("soundBtn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");

      let currentPage = 1;
      let soundEnabled = true;
      let bookReady = false;
      let resizeTimer;

      function isMobile() {
        return window.matchMedia("(max-width: 600px)").matches;
      }

      function getBookSize() {
        const mobile = isMobile();
        const stageWidth = Math.max(200, stage.clientWidth - 8);
        const stageHeight = Math.max(180, stage.clientHeight - 8);

        // Two portrait pages side-by-side on desktop,
        // one portrait page at a time on smaller screens.
        const pagesVisible = mobile ? 1 : 2;
        const pageAspect = IMAGE_WIDTH / IMAGE_HEIGHT;

        let pageWidth = Math.min(
          stageWidth / pagesVisible,
          stageHeight * pageAspect
        );

        let pageHeight = pageWidth / pageAspect;

        if (pageHeight > stageHeight) {
          pageHeight = stageHeight;
          pageWidth = pageHeight * pageAspect;
        }

        return {
          width: Math.max(150, Math.floor(pageWidth * pagesVisible)),
          height: Math.max(180, Math.floor(pageHeight)),
          display: mobile ? "single" : "double"
        };
      }

      function updateControls() {
        indicator.textContent = `Page ${currentPage} of ${TOTAL_PAGES}`;

        firstBtn.disabled = currentPage <= 1;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= TOTAL_PAGES;
        lastBtn.disabled = currentPage >= TOTAL_PAGES;
      }

      function playPageSound() {
        if (!soundEnabled || !sound) return;

        try {
          sound.currentTime = 0;
          const playPromise = sound.play();

          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(() => {
              // Browsers may block audio until the visitor interacts.
            });
          }
        } catch (_) {
          // Sound is optional; navigation should still work.
        }
      }

      function goToPage(page, withSound = true) {
        if (!bookReady) return;

        const target = Math.max(1, Math.min(TOTAL_PAGES, page));

        if (target === currentPage) return;

        if (withSound) playPageSound();

        $("#book").turn("page", target);
        currentPage = target;
        updateControls();
      }

      function resizeBook() {
        if (!bookReady) return;

        const size = getBookSize();
        const previousPage = currentPage;

        try {
          $("#book").turn("size", size.width, size.height);
          $("#book").turn("display", size.display);
          $("#book").turn("page", previousPage);
        } catch (error) {
          console.warn("Unable to resize the Fact Sheet viewer:", error);
        }
      }

      async function preloadImages() {
        const images = Array.from(book.querySelectorAll("img"));

        await Promise.all(images.map((img) => {
          if (img.complete && img.naturalWidth > 0) {
            return Promise.resolve();
          }

          return new Promise((resolve) => {
            img.addEventListener("load", resolve, { once: true });
            img.addEventListener("error", resolve, { once: true });
          });
        }));

        return images.every((img) => img.complete && img.naturalWidth > 0);
      }

      async function initBook() {
        const imagesLoaded = await preloadImages();

        if (!imagesLoaded) {
          loadingMessage.innerHTML =
            '<div class="error-message">' +
            '<strong>Unable to load the Fact Sheet images.</strong><br>' +
            'Please confirm that <code>Page 1.jpg</code> and ' +
            '<code>Page 2.jpg</code> are inside the <code>fact-sheet</code> folder ' +
            'next to this HTML file.' +
            '</div>';
          return;
        }

        if (!window.jQuery || !$.fn.turn) {
          loadingMessage.innerHTML =
            '<div class="error-message">' +
            '<strong>The page-flip library could not load.</strong><br>' +
            'Check your internet connection and reload this page.' +
            '</div>';
          return;
        }

        const size = getBookSize();

        book.hidden = false;
        loadingMessage.style.display = "none";

        $("#book").turn({
          width: size.width,
          height: size.height,
          display: size.display,
          autoCenter: true,
          duration: 850,
          gradients: true,
          elevation: 50,
          acceleration: true,
          when: {
            turning: function (_event, page) {
              if (page !== currentPage) {
                playPageSound();
              }
            },
            turned: function (_event, page) {
              currentPage = page;
              updateControls();
            }
          }
        });

        bookReady = true;
        currentPage = 1;
        updateControls();
      }

      firstBtn.addEventListener("click", () => goToPage(1));
      prevBtn.addEventListener("click", () => goToPage(currentPage - 1));
      nextBtn.addEventListener("click", () => goToPage(currentPage + 1));
      lastBtn.addEventListener("click", () => goToPage(TOTAL_PAGES));

      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.setAttribute(
          "aria-label",
          soundEnabled ? "Turn page sound off" : "Turn page sound on"
        );
        soundBtn.title = soundEnabled ? "Page sound on" : "Page sound off";
        soundBtn.style.borderColor = soundEnabled ? "" : "var(--gold)";
      });

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {
          console.warn("Fullscreen is not available:", error);
        }
      }

      fullscreenBtn.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", () => {
        const active = Boolean(document.fullscreenElement);

        document.body.classList.toggle("fullscreen-mode", active);
        fullscreenBtn.setAttribute(
          "aria-label",
          active ? "Exit fullscreen" : "Enter fullscreen"
        );
        fullscreenBtn.title = active ? "Exit fullscreen" : "Fullscreen";

        window.setTimeout(resizeBook, 150);
      });

      // Keyboard navigation
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          goToPage(currentPage + 1);
        } else if (event.key === "ArrowLeft") {
          goToPage(currentPage - 1);
        } else if (event.key === "Home") {
          goToPage(1);
        } else if (event.key === "End") {
          goToPage(TOTAL_PAGES);
        }
      });

      // Resize without repeatedly recalculating during window resizing.
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(resizeBook, 180);
      });

      initBook();
    })();
  </script>
</body>
</html>
