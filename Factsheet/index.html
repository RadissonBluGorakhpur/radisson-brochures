
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#222222">
  <title>Fact Sheet | Radisson Blu Gorakhpur</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #222;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      flex: 0 0 auto;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      color: #e2c58b;
      background: #151515;
      border-bottom: 1px solid #c5a05955;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
    }

    #flipbook-container {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 5px;
    }

    #flipbook {
      margin: 0 auto;
      position: relative;
    }

    #flipbook .page {
      background: #fff;
      overflow: hidden;
    }

    #flipbook .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
    }

    #flipbook .hard {
      background: #fff;
    }

    #controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 6px max(8px, env(safe-area-inset-bottom));
      background: #151515;
      border-top: 1px solid #c5a05955;
    }

    button {
      min-width: 66px;
      border: 1px solid #c5a05977;
      border-radius: 24px;
      padding: 9px 12px;
      background: #282828;
      color: #eee;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #493c27;
      color: #e2c58b;
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    #page-number {
      min-width: 55px;
      color: #e2c58b;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }

    #error {
      display: none;
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 480px;
      padding: 16px;
      border: 1px solid #c5a059;
      border-radius: 8px;
      background: #171717;
      color: #f0d7a2;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 600px) {
      #header {
        min-height: 36px;
        font-size: 10px;
        letter-spacing: 1px;
      }

      #flipbook-container {
        padding: 3px;
      }

      #controls {
        gap: 5px;
      }

      button {
        min-width: 0;
        padding: 9px 10px;
        font-size: 10px;
      }

      #page-number {
        min-width: 44px;
        font-size: 11px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #header {
        min-height: 28px;
        padding: 4px;
      }

      #controls {
        padding: 4px;
      }

      button {
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <header id="header">
      Radisson Blu Gorakhpur | Fact Sheet
    </header>

    <main id="flipbook-container">
      <div id="flipbook"></div>
    </main>

    <nav id="controls" aria-label="Page navigation">
      <button id="prev" type="button">← Prev</button>
      <span id="page-number">1 / 14</span>
      <button id="next" type="button">Next →</button>
      <button id="fullscreen" type="button">⛶ Fullscreen</button>
    </nav>

  </div>

  <div id="error" role="alert"></div>

  <script>
    $(window).on('load', function () {
      const flipbook = $('#flipbook');
      const container = $('#flipbook-container');

      // Set this to the number of JPG pages you actually have.
      const totalPages = 14;

      let initialized = false;
      let currentPage = 1;
      let resizeTimer = null;

      function showError(message) {
        $('#error').text(message).show();
      }

      if (!$.fn.turn) {
        showError(
          'Turn.js could not load. Check your internet connection and reload this page.'
        );
        return;
      }

      // Build every page before initializing Turn.js.
      for (let i = 1; i <= totalPages; i++) {
        const page = $('<div></div>').addClass('page');

        // First and last pages act as covers.
        if (i === 1 || i === totalPages) {
          page.addClass('hard');
        }

        const img = $('<img>')
          .attr('src', `Page ${i}.jpg`)
          .attr('alt', `Fact sheet page ${i}`)
          .attr('draggable', 'false');

        img.on('error', function () {
          showError(
            `Could not load Page ${i}.jpg. Make sure the image exists in the same folder as this HTML file.`
          );
        });

        page.append(img);
        flipbook.append(page);
      }

      function calculateSize() {
        const availableWidth = container.innerWidth();
        const availableHeight = container.innerHeight();

        // Approximate source ratio for each portrait page.
        const pageRatio = 420 / 600;
        const isMobile = window.innerWidth <= 600;

        let pageWidth;
        let pageHeight;

        if (isMobile) {
          // Mobile: one page fills the available area.
          pageWidth = Math.min(
            availableWidth,
            availableHeight * pageRatio
          );

          pageHeight = pageWidth / pageRatio;
        } else {
          // Desktop: two pages fit side-by-side.
          pageWidth = Math.min(
            availableWidth / 2,
            availableHeight * pageRatio
          );

          pageHeight = pageWidth / pageRatio;
        }

        return {
          width: Math.max(150, Math.floor(pageWidth)),
          height: Math.max(200, Math.floor(pageHeight))
        };
      }

      function resizeFlipbook() {
        if (!initialized) return;

        const size = calculateSize();

        flipbook.turn('size', size.width, size.height);

        const desiredDisplay =
          window.innerWidth <= 600 ? 'single' : 'double';

        if (flipbook.turn('display') !== desiredDisplay) {
          flipbook.turn('display', desiredDisplay);
        }
      }

      function updateControls() {
        currentPage = flipbook.turn('page');

        $('#page-number').text(`${currentPage} / ${totalPages}`);
        $('#prev').prop('disabled', currentPage <= 1);
        $('#next').prop('disabled', currentPage >= totalPages);
      }

      const initialSize = calculateSize();

      flipbook.turn({
        width: initialSize.width,
        height: initialSize.height,
        display: window.innerWidth <= 600 ? 'single' : 'double',
        autoCenter: true,
        acceleration: true,
        gradients: true,
        elevation: 50,
        duration: 850,
        page: 1
      });

      initialized = true;

      // Start directly on the first page.
      flipbook.turn('page', 1);
      updateControls();
      resizeFlipbook();

      flipbook.on('turned', function () {
        updateControls();
      });

      $('#prev').on('click', function () {
        flipbook.turn('previous');
      });

      $('#next').on('click', function () {
        flipbook.turn('next');
      });

      $('#fullscreen').on('click', async function () {
        try {
          if (!document.fullscreenElement) {
            await document.getElementById('app').requestFullscreen();
          } else {
            await document.exitFullscreen();
          }

          setTimeout(resizeFlipbook, 150);
        } catch (error) {
          showError('Fullscreen is not available in this browser.');
        }
      });

      document.addEventListener('fullscreenchange', function () {
        $('#fullscreen').text(
          document.fullscreenElement ? 'Exit Fullscreen' : '⛶ Fullscreen'
        );

        setTimeout(resizeFlipbook, 150);
      });

      $(window).on('resize orientationchange', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resizeFlipbook, 150);
      });

      $(document).on('keydown', function (event) {
        if (event.key === 'ArrowLeft') {
          flipbook.turn('previous');
        } else if (event.key === 'ArrowRight') {
          flipbook.turn('next');
        } else if (event.key === 'Home') {
          flipbook.turn('page', 1);
        } else if (event.key === 'End') {
          flipbook.turn('page', totalPages);
        }
      });
    });
  </script>
</body>
</html>
